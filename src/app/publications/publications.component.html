<app-page-hero title="Publications" quote="One needs the strength of character."></app-page-hero>

<section class="vi-section">
  <div class="vi-wrap">
    <p class="vi-lead">Over 60 years of research, A. Parthasarathy has designed a number of publications on Vedanta.</p>

    <div class="vi-card-grid vi-pub-grid">
      <article class="vi-card" *ngFor="let p of publications">
        <div class="vi-card-img"><img [src]="p.image" [alt]="p.title"></div>
        <div class="vi-card-body">
          <h3>{{ p.title }}</h3>
          <p>{{ p.text }}</p>
          <a class="vi-link" [href]="p.url" target="_blank" rel="noopener">Read more</a>
        </div>
      </article>
    </div>
  </div>
</section>
