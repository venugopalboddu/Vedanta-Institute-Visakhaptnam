<app-page-hero title="Events" quote="Thus must you discover the eternities."></app-page-hero>

<section class="vi-section">
  <div class="vi-wrap vi-split">
    <div>
      <h2 class="vi-heading">Future events</h2>
      <p class="vi-lead">
        Vedanta World conducts various events all over the world. Open the full itinerary to see where the next
        programme is happening.
      </p>
      <a class="vi-btn vi-btn-dark" [href]="itineraryUrl" target="_blank" rel="noopener">View the itinerary</a>
    </div>
    <img class="vi-events-img" src="assets/img/ved.PNG" alt="Vedanta World events">
  </div>
</section>
